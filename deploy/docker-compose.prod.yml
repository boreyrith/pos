# Production: HTTPS on 80/443 through Caddy for the web app (and the API, if API_ADDRESS is set);
# the database stays on a private network.
#   cd deploy && ./init-env.sh && docker compose -f docker-compose.prod.yml up -d --build
# See DEPLOY.md.
name: pos

# Each service has a memory ceiling, so one that runs away (or a large upload) can't take the whole
# server down with it; raise them in .env on a bigger server (MYSQL_MEMORY, BACKEND_MEMORY, WEB_MEMORY
# for each web app, CADDY_MEMORY, BACKUP_MEMORY). The API uses up to 75% of its limit for Java's heap,
# and needs about 1.5 GB to take a 100 MB APK upload. Together they fit a 4 GB server.
#
# Container logs are capped (5 files of 10 MB per service), so a server that runs for months
# doesn't fill its disk with them.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MYSQL_MEMORY:-1g}
    environment:
      MYSQL_DATABASE: pos_next
      MYSQL_USER: pos
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
      TZ: UTC
    # Packets for the largest file kept in the database, the mobile app's APK (up to 100 MB), which the
    # MySQL driver sends escaped, about twice its size.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-allowed-packet=256M"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ../backend
    image: pos-backend:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BACKEND_MEMORY:-1536m}
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/pos_next?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: pos
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl; bash can make the request itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /api/actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  # The web apps, each under its own path on SITE_ADDRESS (the proxy routes /api, /ctl, /cas, /buy, /app,
  # the rest): administration, the till, the online shop, the mobile app page, and the portal at /.
  frontend-ctl:
    build:
      context: ..
      dockerfile: web.Dockerfile
      args:
        APP: frontend-ctl
    image: pos-frontend-ctl:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEMORY:-384m}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ctl/login > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend-cas:
    build:
      context: ..
      dockerfile: web.Dockerfile
      args:
        APP: frontend-cas
    image: pos-frontend-cas:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEMORY:-384m}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/cas/login > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend-buy:
    build:
      context: ..
      dockerfile: web.Dockerfile
      args:
        APP: frontend-buy
    image: pos-frontend-buy:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEMORY:-384m}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/buy/account > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend-app:
    build:
      context: ..
      dockerfile: web.Dockerfile
      args:
        APP: frontend-app
    image: pos-frontend-app:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEMORY:-384m}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/app > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend-nav:
    build:
      context: ..
      dockerfile: web.Dockerfile
      args:
        APP: frontend-nav
    image: pos-frontend-nav:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: ${WEB_MEMORY:-384m}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    logging: *logging
    mem_limit: ${CADDY_MEMORY:-256m}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env}
      # Empty means no separate API address (Caddy needs some address, so it gets one nobody can reach).
      API_ADDRESS: ${API_ADDRESS:-http://api.localhost}
      TLS: ${TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend-ctl
      - frontend-cas
      - frontend-buy
      - frontend-app
      - frontend-nav
      - backend

  # A dump of the database every day (BACKUP_EVERY_HOURS), kept for BACKUP_KEEP_DAYS, in deploy/backups.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BACKUP_MEMORY:-512m}
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./dump.sh:/dump.sh:ro
      - ./backups:/backups
    depends_on:
      # Waits for the API, so the first dump comes after the tables are created.
      backend:
        condition: service_healthy

  # Optional: copies deploy/backups off the server with rclone (a NAS, another machine or cloud
  # storage), so a failed disk doesn't take the backups with it. Turn it on with
  # COMPOSE_PROFILES=offsite and BACKUP_REMOTE in .env; see "Copy backups off the server" in DEPLOY.md.
  backup-offsite:
    image: rclone/rclone:1.75.2
    profiles: ["offsite"]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${BACKUP_MEMORY:-512m}
    entrypoint: ["/bin/sh", "/backup-offsite.sh"]
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_EVERY_HOURS: ${BACKUP_REMOTE_EVERY_HOURS:-1}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-90}
    volumes:
      - ./backup-offsite.sh:/backup-offsite.sh:ro
      - ./backups:/backups:ro
      # rclone.conf, written by "rclone config" (it holds the remote's credentials; not in git).
      - ./rclone:/config/rclone

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
