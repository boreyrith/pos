# Production: HTTPS on 80/443 through Caddy for the web app (and the API, if API_ADDRESS is set);
# the database stays on a private network.
#   cd deploy && ./init-env.sh && docker compose -f docker-compose.prod.yml up -d --build
# See DEPLOY.md.
name: pos

# Container logs are capped (5 files of 10 MB per service), so a server that runs for months
# doesn't fill its disk with them.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: pos_next
      MYSQL_USER: pos
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in deploy/.env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: ../backend
    image: pos-backend:latest
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/pos_next?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: pos
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # The JRE image has no curl; bash can make the request itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /api/actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  frontend:
    build: ../frontend
    image: pos-frontend:latest
    restart: unless-stopped
    logging: *logging
    environment:
      API_URL: http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env}
      # Empty means no separate API address (Caddy needs some address, so it gets one nobody can reach).
      API_ADDRESS: ${API_ADDRESS:-http://api.localhost}
      TLS: ${TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  # A dump of the database every day (BACKUP_EVERY_HOURS), kept for BACKUP_KEEP_DAYS, in deploy/backups.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      # Waits for the API, so the first dump comes after the tables are created.
      backend:
        condition: service_healthy

  # Optional: copies deploy/backups off the server with rclone (a NAS, another machine or cloud
  # storage), so a failed disk doesn't take the backups with it. Turn it on with
  # COMPOSE_PROFILES=offsite and BACKUP_REMOTE in .env; see "Copy backups off the server" in DEPLOY.md.
  backup-offsite:
    image: rclone/rclone:1.75.2
    profiles: ["offsite"]
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/backup-offsite.sh"]
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_EVERY_HOURS: ${BACKUP_REMOTE_EVERY_HOURS:-1}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-90}
    volumes:
      - ./backup-offsite.sh:/backup-offsite.sh:ro
      - ./backups:/backups:ro
      # rclone.conf, written by "rclone config" (it holds the remote's credentials; not in git).
      - ./rclone:/config/rclone

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
