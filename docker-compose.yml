# Development only (never on a production server): `docker compose up -d mysql`, then run the
# backend and frontend locally. Everything in containers: `docker compose --profile app up -d --build`.
# Its own project name, so it can never act on the production stack (deploy/, project "pos"), even
# when the repository folder is called "pos". "pos-next" keeps existing development databases.
name: pos-next

services:
  mysql:
    image: mysql:8.4
    # Packets for the mobile app's APK (up to 100 MB, the largest file kept in the database), which the
    # MySQL driver sends escaped, about twice its size.
    command: ["--max-allowed-packet=256M"]
    environment:
      MYSQL_DATABASE: pos_next
      MYSQL_USER: pos
      MYSQL_PASSWORD: pos
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upos", "-ppos"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    profiles: [app]
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pos_next?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

  # The web apps, as on a real server: http://localhost:3000 routes /api to the backend, /ctl, /cas,
  # /buy and /app to their apps and the rest to the portal.
  frontend-ctl:
    profiles: [app]
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        APP: frontend-ctl
    depends_on:
      - backend
  frontend-cas:
    profiles: [app]
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        APP: frontend-cas
    depends_on:
      - backend
  frontend-buy:
    profiles: [app]
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        APP: frontend-buy
    depends_on:
      - backend
  frontend-app:
    profiles: [app]
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        APP: frontend-app
    depends_on:
      - backend
  frontend-nav:
    profiles: [app]
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        APP: frontend-nav
    depends_on:
      - backend
  web:
    profiles: [app]
    image: caddy:2.10
    configs:
      - source: web-routes
        target: /etc/caddy/Caddyfile
    depends_on:
      - frontend-ctl
      - frontend-cas
      - frontend-buy
      - frontend-app
      - frontend-nav
    ports:
      - "3000:3000"

configs:
  web-routes:
    content: |
      :3000 {
        handle /api/* {
          reverse_proxy backend:8081
        }
        @cas path /cas /cas/*
        handle @cas {
          reverse_proxy frontend-cas:3000
        }
        @ctl path /ctl /ctl/*
        handle @ctl {
          reverse_proxy frontend-ctl:3000
        }
        @buy path /buy /buy/*
        handle @buy {
          reverse_proxy frontend-buy:3000
        }
        @app path /app /app/*
        handle @app {
          reverse_proxy frontend-app:3000
        }
        handle {
          reverse_proxy frontend-nav:3000
        }
      }

volumes:
  mysql-data:
