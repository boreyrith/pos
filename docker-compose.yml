# Development: `docker compose up -d mysql`, then run the backend and frontend locally.
# Everything in containers: `docker compose --profile app up -d --build`.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pos_next
      MYSQL_USER: pos
      MYSQL_PASSWORD: pos
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upos", "-ppos"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    profiles: [app]
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pos_next?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: pos
      DB_PASSWORD: pos
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    profiles: [app]
    build: ./frontend
    environment:
      API_URL: http://backend:8081
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql-data:
